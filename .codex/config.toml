# EagleSpy V5 Project Configuration
# Project-specific overrides for Codex

model = "gpt-5.2"
model_reasoning_effort = "high"
personality = "pragmatic"

[features]
unified_exec = true
shell_snapshot = true

# EagleSpy specific context
[experimental]
# Allow Codex to understand the project structure
instructions_file = "CODEX_INSTRUCTIONS.md"

# Security monitoring project settings
[sandbox_workspace_write]
network_access = true  # Needed for Docker/Rails/PostgreSQL operations

[shell_environment_policy]
# Include necessary environment variables for development
include_only = [
    "PATH",
    "HOME",
    "JAVA_HOME",
    "DOCKER_HOST",
    "DATABASE_URL",
    "RAILS_ENV",
    "REDIS_URL"
]
