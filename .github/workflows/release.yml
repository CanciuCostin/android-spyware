name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Generate Release Notes
        id: release_notes
        run: |
          # Get previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 $(git rev-list --tags --skip=1 --max-count=1) 2>/dev/null || echo "")
          
          if [ -z "$PREV_TAG" ]; then
            COMMITS=$(git log --pretty=format:"- %s (%h)" ${{ github.ref_name }})
          else
            COMMITS=$(git log --pretty=format:"- %s (%h)" ${PREV_TAG}..${{ github.ref_name }})
          fi
          
          # Categorize commits
          FEATURES=$(echo "$COMMITS" | grep -i "^- feat:" || echo "")
          FIXES=$(echo "$COMMITS" | grep -i "^- fix:" || echo "")
          CHORES=$(echo "$COMMITS" | grep -i "^- chore:" || echo "")
          
          # Build release notes
          echo "## Release Notes - ${{ github.ref_name }}" > release_notes.md
          echo "" >> release_notes.md
          
          if [ -n "$FEATURES" ]; then
            echo "### ✨ New Features" >> release_notes.md
            echo "$FEATURES" >> release_notes.md
            echo "" >> release_notes.md
          fi
          
          if [ -n "$FIXES" ]; then
            echo "### 🐛 Bug Fixes" >> release_notes.md
            echo "$FIXES" >> release_notes.md
            echo "" >> release_notes.md
          fi
          
          if [ -n "$CHORES" ]; then
            echo "### 🔧 Chores" >> release_notes.md
            echo "$CHORES" >> release_notes.md
          fi
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          body_path: release_notes.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to Docker Registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_REGISTRY }}/eaglespy:${{ github.ref_name }}
            ${{ secrets.DOCKER_REGISTRY }}/eaglespy:latest
          cache-from: type=registry,ref=${{ secrets.DOCKER_REGISTRY }}/eaglespy:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_REGISTRY }}/eaglespy:buildcache,mode=max
